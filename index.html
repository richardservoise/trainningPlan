function sessionText(x){return `${x.title}\n${fmt(x.date)} · ${duration(x.min)}\n\n${x.blocks.map((b,i)=>`${i+1}. ${b.name} · ${blockDuration(b.min)}\n${b.target}`).join('\n\n')}\n\n${x.note}`}
function openSession(id){const x=plan.find(a=>a.id===id),log=state.logs[id]||{};$('#detailBody').innerHTML=`<p class="eyebrow">${sports[x.sport][1]} · ${fmt(x.date)}</p><h2>${esc(x.title)}</h2><p class="lead">${x.location?x.location+' · ':''}${duration(x.min)} · ${esc(x.phase)}</p>${intensityBadge(x)}${intensityStrip(x)}<p>${esc(x.why)}</p>${x.blocks.map((b,i)=>`<div class="block intensity-${intensityLevels[blockIntensity(b)].key}"><span class="num">${String(i+1).padStart(2,'0')}</span><div><strong>${esc(b.name)}</strong><span class="block-intensity">${intensityLevels[blockIntensity(b)].label}</span><p>${esc(b.target)}</p></div><time>${blockDuration(b.min)}</time></div>`).join('')}<div class="note">${esc(x.note||'Adapter à tes sensations du jour.')}</div>${x.sport==='run'?'<p class="legend">Garmin : reproduire ces blocs dans Connect → Entraînements → Course à pied, puis envoyer à la Fenix 8. Pas de synchronisation automatique.</p>':''}<div class="actions"><button class="btn" id="copySession">Copier la fiche</button>${x.sport==='bike'?'<button class="btn" id="zwoExport">Exporter vélo .zwo</button>':''}</div><form id="logForm"><label for="feel">Effort ressenti · 1 très facile → 10 maximal</label><input id="feel" name="feel" type="number" min="1" max="10" value="${esc(log.feel||'')}" placeholder="Ex. 4"><label for="notes">Sensations, fatigue, ravitaillement</label><textarea id="notes" name="notes" maxlength="2000" placeholder="Ce qui a bien fonctionné, ce qui est à adapter…">${esc(log.notes||'')}</textarea><div class="actions"><button class="btn primary" type="submit">${log.done?'Mettre à jour':'Valider la séance'}</button><button class="btn" id="uncheck" type="button">Marquer non faite</button></div></form><label for="moveDate">Déplacer cette séance</label><div class="actions"><input id="moveDate" type="date" value="${x.date}" min="${start}" max="${add(state.settings.ultra,14)}"><button class="btn" id="moveSession">Déplacer</button></div><p class="legend">Le déplacement est manuel : pas de compensation ni de recalcul automatique des autres séances.</p>`;$('#detail').showModal();$('#closeDetail').onclick=()=>$('#detail').close();$('#copySession').onclick=async()=>{try{await navigator.clipboard.writeText(sessionText(x));toast('Fiche copiée')}catch{download(x.id+'.txt',sessionText(x),'text/plain')}};if($('#zwoExport'))$('#zwoExport').onclick=()=>zwo(x);$('#logForm').onsubmit=e=>{e.preventDefault();state.logs[id]={done:true,feel:$('#feel').value,notes:$('#notes').value,title:x.title,date:x.date,minutes:x.min,blocks:x.blocks};persist();$('#detail').close();render();toast('Séance enregistrée')};$('#uncheck').onclick=()=>{state.logs[id]={...log,done:false,feel:$('#feel').value,notes:$('#notes').value};persist();$('#detail').close();render()};$('#moveSession').onclick=()=>{const v=$('#moveDate').value;if(!v||v<start||v>add(state.settings.ultra,14))return toast('Choisir une date dans le plan');state.moves[id]=v;persist();buildPlan();$('#detail').close();render();toast('Séance déplacée')};}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function zwo(x){const xml=`<?xml version="1.0" encoding="UTF-8"?><workout_file><author>Richard Endurance</author><name>${esc(x.title)}</name><description>FTP de référence ${state.settings.ftp} W. Vérifier la FTP dans la plateforme avant la séance.</description><sportType>bike</sportType><workout>${x.blocks.map(b=>`<SteadyState Duration="${b.min*60}" Power="${b.power||.6}"/>`).join('')}</workout></workout_file>`;download(x.id+'.zwo',xml,'application/xml');toast('Export .zwo · plateforme compatible requise')}
function calendarExport(){let clean=s=>s.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'),rows=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Richard Endurance//FR','CALSCALE:GREGORIAN'];plan.forEach(x=>rows.push('BEGIN:VEVENT','UID:'+x.id+'@richard-endurance','DTSTAMP:'+today.replaceAll('-','')+'T120000Z','DTSTART;VALUE=DATE:'+x.date.replaceAll('-',''),'DTEND;VALUE=DATE:'+add(x.date,x.title.startsWith('Race Across')?4:1).replaceAll('-',''),'SUMMARY:'+clean(x.title+' · '+duration(x.min)),'DESCRIPTION:'+clean(sessionText(x)),'END:VEVENT'));rows.push('END:VCALENDAR');const encoder=new TextEncoder();let folded=rows.map(row=>{let out='',count=0;for(const ch of row){let n=encoder.encode(ch).length;if(count+n>73){out+='\r\n ';count=1}out+=ch;count+=n}return out}).join('\r\n');download('richard-endurance-2027.ics',folded,'text/calendar')}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab==='week')week=monday(selected);render()});buildPlan();render();


</script></body></html>
